name: Python tests

on: [push]

jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install Python 3.14
        run: uv python install 3.14


      - name: "Create venv"
        run: uv venv

      - name: "Install requirements"
        run: uv pip install -r requirements_test.txt

      - name: "Run pytest"
        run: |
          status=0
          uv run pytest tests -n auto --cov-branch --cov-report=term-missing:skip-covered > report.txt 2>&1 || status=$?
          cat report.txt
          msg=$(grep -E "^(custom_components|TOTAL|FAILED|ERROR)" report.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=coverage::${msg:-no missing lines}"
          exit $status

